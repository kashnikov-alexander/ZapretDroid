name: Build ZapretDroid APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную на странице Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Сборка Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Загрузка готового APK в раздел Artifacts страницы Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapretDroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
